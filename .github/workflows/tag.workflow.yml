name: Version Tag Release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: npm setup
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.24.x"
      - name: Setup pnpm
        run: npm install -g pnpm@9
      - name: Install dependencies
        run: |
          go mod tidy
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Compile server
        run: bash ./build.sh
      - name: Tag Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          make_latest: "false"
          fail_on_unmatched_files: true
          files: |
            dist/*
      - name: Latest Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: latest
          fail_on_unmatched_files: true
          files: |
            dist/*
      - name: Setup ko
        uses: ko-build/setup-ko@v0.9
        env:
          KO_DOCKER_REPO: docker.io/fengmuxi/frp-panel
      - name: Build image with ko
        env:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "${password}" | ko login docker.io --username ${username} --password-stdin
          ko build ./cmd/frpp --sbom=none --bare -t ${{ github.ref_name }}
          ko build ./cmd/frpp --sbom=none --bare -t latest