syntax = "proto3";
package api_master;

import "common.proto";
option go_package="../pb";

message ClientStatus {
  enum Status {
    STATUS_UNSPECIFIED = 0;
    STATUS_ONLINE = 1;
    STATUS_OFFLINE = 2;
    STATUS_ERROR = 3;
  }
  common.ClientType client_type = 1;
  string client_id = 2;
  Status status = 3;
  int32 ping = 4; // 单位为毫秒
  optional ClientVersion version = 5;
  optional string addr = 6;
  optional int64 connect_time = 7; // 连接建立的时间
}

message ClientVersion {
	string GitVersion = 1;
	string GitCommit = 2;
	string BuildDate = 3;
	string GoVersion = 4;
	string Compiler = 5;
	string Platform = 6;
  string GitBranch = 7;
}

message GetClientsStatusRequest {
  common.ClientType client_type = 1;
  repeated string client_ids = 2;
}

message GetClientsStatusResponse {
  optional common.Status status = 1;
  map<string, ClientStatus> clients = 2;
}

message GetClientCertRequest {
  common.ClientType client_type = 1;
  string client_id = 2;
  string client_secret = 3;
}

message GetClientCertResponse {
  optional common.Status status = 1;
  bytes cert = 2;
}

message StartSteamLogRequest {
  repeated string pkgs = 1; // 需要获取哪些包的日志
}

message StartSteamLogResponse {
  optional common.Status status = 1;
}

message GetProxyTrafficStatsRequest {
  optional int64 start_time = 1; // unix 秒，起始日 00:00（按前端时区，含）
  optional int64 end_time = 2; // unix 秒，语义为"含 end 所在整天"
  optional bool with_series = 3; // 是否返回日粒度趋势序列
  optional int32 tz_offset_minutes = 4; // 前端时区偏移分钟 = -new Date().getTimezoneOffset()
}

message ProxyTrafficItem {
  optional int32 proxy_id = 1;
  optional string name = 2;
  optional string type = 3;
  optional int64 traffic_in = 4;
  optional int64 traffic_out = 5;
}

message TrafficSeriesPoint {
  optional int64 ts = 1; // 该日 00:00 的 unix 秒（按前端时区）
  optional int64 traffic_in = 2;
  optional int64 traffic_out = 3;
}

message GetProxyTrafficStatsResponse {
  optional common.Status status = 1;
  repeated ProxyTrafficItem items = 2; // 按 (traffic_in + traffic_out) 降序
  repeated TrafficSeriesPoint series = 3; // 日粒度趋势，按天升序
  optional int64 total_in = 4;
  optional int64 total_out = 5;
}